<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LetsGo - Random Chat</title>
  <style>
    /* Base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #4c1d95, #1e1b4b);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Chat container */
    .chat-container {
      width: 100%;
      max-width: 450px;
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Header */
    .chat-header {
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(to right, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
    }

    .status-indicator.connected {
      background-color: #10b981;
    }

    .status-text {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Messages area */
    .messages-container {
      height: 400px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Custom scrollbar */
    .messages-container::-webkit-scrollbar {
      width: 6px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }

    /* Message bubbles */
    .message {
      max-width: 80%;
      padding: 0.75rem;
      word-break: break-word;
      color: white;
    }

    .message.me {
      align-self: flex-end;
      background-color: #8b5cf6;
      border-radius: 12px 12px 0 12px;
    }

    .message.partner {
      align-self: flex-start;
      background-color: #4f46e5;
      border-radius: 12px 12px 12px 0;
    }

    .message.system {
      align-self: center;
      background-color: rgba(107, 114, 128, 0.5);
      border-radius: 12px;
      text-align: center;
      font-size: 0.875rem;
    }

    /* Input area */
    .input-container {
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .message-form {
      display: flex;
      gap: 0.5rem;
    }

    .message-input {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
    }

    .message-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .message-input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
    }

    /* Buttons */
    .button {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .button-primary {
      background-color: #8b5cf6;
      color: white;
    }

    .button-primary:hover {
      background-color: #7c3aed;
    }

    .button-outline {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
    }

    .button-outline:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-container {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .button-icon {
      margin-right: 0.5rem;
    }

    /* Icons */
    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1 class="chat-title">LetsGo</h1>
      <div class="connection-status">
        <div id="status-indicator" class="status-indicator"></div>
        <span id="status-text" class="status-text">Disconnected</span>
      </div>
    </div>

    <div id="messages" class="messages-container"></div>

    <div class="input-container">
      <div class="message-form">
        <input id="message-input" class="message-input" type="text" placeholder="Type a message..." />
        <button id="send-button" class="button button-primary" disabled>
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"></path>
          </svg>
        </button>
      </div>

      <div class="button-container">
        <button id="disconnect-button" class="button button-outline" style="flex: 1">
          <svg class="icon button-icon" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path>
          </svg>
          Disconnect
        </button>
        <button id="next-button" class="button button-outline" style="flex: 1">
          <svg class="icon button-icon" viewBox="0 0 24 24">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Next
        </button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const messagesContainer = document.getElementById("messages");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const disconnectButton = document.getElementById("disconnect-button");
    const nextButton = document.getElementById("next-button");
    const statusIndicator = document.getElementById("status-indicator");
    const statusText = document.getElementById("status-text");

    // WebSocket connection
    let socket = null;
    let isConnected = false;

    // Connect to WebSocket server
    function connectWebSocket() {
      // Clear previous messages when starting a new connection
      messagesContainer.innerHTML = "";

      // Create new WebSocket connection
      socket = new WebSocket("ws://localhost:8080/ws");

      socket.onopen = function () {
        console.log("Connected to WebSocket");
        isConnected = true;
        updateConnectionStatus(true);
        appendMessage("system", "Connected to chat. Say hello!");
        sendButton.disabled = false;
      };

      socket.onmessage = function (event) {
        appendMessage("partner", event.data);
      };

      socket.onclose = function () {
        console.log("Disconnected");
        isConnected = false;
        updateConnectionStatus(false);
        appendMessage("system", "Disconnected from chat");
        sendButton.disabled = true;
      };

      socket.onerror = function (error) {
        console.error("WebSocket Error:", error);
        appendMessage("system", "Connection error. Please try again.");
        isConnected = false;
        updateConnectionStatus(false);
        sendButton.disabled = true;
      };
    }

    // Update connection status UI
    function updateConnectionStatus(connected) {
      if (connected) {
        statusIndicator.classList.add("connected");
        statusText.textContent = "Connected";
      } else {
        statusIndicator.classList.remove("connected");
        statusText.textContent = "Disconnected";
      }
    }

    // Append message to chat
    function appendMessage(sender, text) {
      const messageElement = document.createElement("div");
      messageElement.className = `message ${sender}`;
      messageElement.textContent = text;
      messagesContainer.appendChild(messageElement);

      // Scroll to bottom
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Send message
    function sendMessage() {
      const message = messageInput.value.trim();
      if (message && socket && isConnected) {
        socket.send(message);
        appendMessage("me", message);
        messageInput.value = "";
      }
    }

    // Disconnect from chat
    function disconnect() {
      if (socket) {
        socket.close();
      }
    }

    // Find new partner
    function findNewPartner() {
      disconnect();
      connectWebSocket();
    }

    // Event listeners
    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    disconnectButton.addEventListener("click", disconnect);
    nextButton.addEventListener("click", findNewPartner);

    // Initialize connection on page load
    connectWebSocket();
  </script>
</body>

</html>
