<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LETSGO Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-color: #121212;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #1a1a2e 100%
        );
        position: relative;
        overflow: hidden;
      }

      /* Cool background elements */
      .bg-element {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.15;
        z-index: -1;
        animation: float 15s infinite ease-in-out;
      }

      .bg-element:nth-child(1) {
        width: 300px;
        height: 300px;
        background: #8e44ad;
        top: -100px;
        left: 10%;
        animation-delay: 0s;
      }

      .bg-element:nth-child(2) {
        width: 400px;
        height: 400px;
        background: #3498db;
        bottom: -150px;
        right: 10%;
        animation-delay: -5s;
      }

      .bg-element:nth-child(3) {
        width: 250px;
        height: 250px;
        background: #9b59b6;
        top: 40%;
        left: -100px;
        animation-delay: -10s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0);
        }

        25% {
          transform: translateY(-20px) translateX(20px);
        }

        50% {
          transform: translateY(0) translateX(40px);
        }

        75% {
          transform: translateY(20px) translateX(20px);
        }
      }

      .container {
        width: 100%;
        max-width: 500px;
        height: 600px;
        background-color: rgba(30, 30, 46, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Home Screen */
      .home-screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .app-logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 20px;
        color: #8e44ad;
        text-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
        letter-spacing: 2px;
      }

      .app-description {
        margin-bottom: 40px;
        color: #a0a0a0;
        font-size: 1rem;
      }

      .start-btn {
        background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 30px;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(142, 68, 173, 0.3);
      }

      .start-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(142, 68, 173, 0.4);
      }

      .tag-input-container {
        width: 100%;
        max-width: 300px;
        margin-bottom: 20px;
      }

      .tag-input {
        width: 100%;
        padding: 12px 20px;
        margin-bottom: 10px;
        border-radius: 30px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        background-color: rgba(42, 42, 42, 0.6);
        color: white;
        font-size: 1rem;
        text-align: center;
        outline: none;
        transition: all 0.3s ease;
      }

      .tag-input:focus {
        border-color: #8e44ad;
        box-shadow: 0 0 8px rgba(142, 68, 173, 0.5);
      }

      .tags-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
        max-width: 300px;
      }

      .tag {
        background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        animation: tagFadeIn 0.3s ease;
      }

      @keyframes tagFadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .tag-remove {
        margin-left: 6px;
        width: 16px;
        height: 16px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s ease;
      }

      .tag-remove:hover {
        background-color: rgba(255, 255, 255, 0.4);
      }

      .tag-hint {
        font-size: 0.8rem;
        color: #a0a0a0;
        margin-top: 5px;
      }

      /* Loading Screen */
      .loading-screen {
        height: 100%;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .loading-text {
        font-size: 1.5rem;
        margin-bottom: 30px;
        color: #8e44ad;
        text-shadow: 0 0 10px rgba(142, 68, 173, 0.3);
      }

      .loading-animation {
        width: 80px;
        height: 80px;
        position: relative;
      }

      .loading-animation div {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
        animation: loading 1.2s linear infinite;
        box-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
      }

      .loading-animation div:nth-child(1) {
        top: 8px;
        left: 8px;
        animation-delay: 0s;
      }

      .loading-animation div:nth-child(2) {
        top: 8px;
        left: 32px;
        animation-delay: -0.4s;
      }

      .loading-animation div:nth-child(3) {
        top: 8px;
        left: 56px;
        animation-delay: -0.8s;
      }

      .loading-animation div:nth-child(4) {
        top: 32px;
        left: 8px;
        animation-delay: -0.4s;
      }

      .loading-animation div:nth-child(5) {
        top: 32px;
        left: 32px;
        animation-delay: -0.8s;
      }

      .loading-animation div:nth-child(6) {
        top: 32px;
        left: 56px;
        animation-delay: -1.2s;
      }

      .loading-animation div:nth-child(7) {
        top: 56px;
        left: 8px;
        animation-delay: -0.8s;
      }

      .loading-animation div:nth-child(8) {
        top: 56px;
        left: 32px;
        animation-delay: -1.2s;
      }

      .loading-animation div:nth-child(9) {
        top: 56px;
        left: 56px;
        animation-delay: -1.6s;
      }

      @keyframes loading {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }

      /* Chat Screen */
      .chat-screen {
        height: 100%;
        display: none;
        flex-direction: column;
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: rgba(42, 42, 42, 0.6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .back-btn,
      .next-btn {
        background-color: transparent;
        color: #8e44ad;
        border: none;
        font-size: 1rem;
        cursor: pointer;
        padding: 5px 10px;
        transition: all 0.3s ease;
      }

      .back-btn:hover,
      .next-btn:hover {
        color: #9b59b6;
        transform: scale(1.05);
      }

      .partner-status {
        font-size: 1rem;
        color: #8e44ad;
        text-shadow: 0 0 5px rgba(142, 68, 173, 0.3);
      }

      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .message {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 18px;
        word-wrap: break-word;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .partner-message {
        align-self: flex-start;
        background-color: rgba(42, 42, 42, 0.6);
        border-bottom-left-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .my-message {
        align-self: flex-end;
        background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
        color: white;
        border-bottom-right-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .message-label {
        font-size: 0.8rem;
        margin-bottom: 5px;
        opacity: 0.7;
      }

      /* Typing indicator */
      .typing-indicator {
        display: none;
        align-self: flex-start;
        background-color: rgba(42, 42, 42, 0.6);
        padding: 12px 20px;
        border-radius: 18px;
        border-bottom-left-radius: 5px;
        margin: 5px 0 10px 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.3s ease;
      }

      .typing-dots {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background-color: #8e44ad;
        border-radius: 50%;
        opacity: 0.7;
      }

      .typing-dot:nth-child(1) {
        animation: typingDot 1.4s infinite;
        animation-delay: 0s;
      }

      .typing-dot:nth-child(2) {
        animation: typingDot 1.4s infinite;
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation: typingDot 1.4s infinite;
        animation-delay: 0.4s;
      }

      @keyframes typingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }

        30% {
          transform: translateY(-5px);
        }
      }

      .chat-input-area {
        display: flex;
        padding: 15px;
        background-color: rgba(42, 42, 42, 0.6);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .message-input {
        flex: 1;
        padding: 12px 20px;
        border-radius: 30px;
        border: none;
        background-color: rgba(58, 58, 58, 0.6);
        color: white;
        font-size: 1rem;
        outline: none;
      }

      .send-btn {
        background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
        color: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin-left: 10px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .send-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .send-icon {
        width: 20px;
        height: 20px;
        fill: white;
      }

      /* Scrollbar styling */
      .chat-messages::-webkit-scrollbar {
        width: 6px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: rgba(30, 30, 46, 0.5);
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background-color: rgba(58, 58, 58, 0.8);
        border-radius: 6px;
      }

      /* Connected notification */
      .connected-notification {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(
          135deg,
          rgba(142, 68, 173, 0.9) 0%,
          rgba(155, 89, 182, 0.9) 100%
        );
        padding: 20px 40px;
        border-radius: 10px;
        font-size: 1.2rem;
        z-index: 10;
        animation: fadeInOut 2s forwards;
        display: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
        }

        20% {
          opacity: 1;
        }

        80% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background elements -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>

    <div class="container">
      <!-- Home Screen -->
      <div class="home-screen" id="homeScreen">
        <h1 class="app-logo">LETSGO</h1>
        <p class="app-description">
          Connect with random people and start chatting!
        </p>
        <div class="tag-input-container">
          <div class="tags-container" id="tagsContainer">
            <!-- Tags will be added here dynamically -->
          </div>
          <input
            type="text"
            class="tag-input"
            id="tagInput"
            placeholder="Enter tags (optional)"
          />
          <div class="tag-hint">Press Enter or comma to add tags</div>
        </div>
        <button class="start-btn" id="startBtn">Start Chatting</button>
      </div>

      <!-- Loading Screen -->
      <div class="loading-screen" id="loadingScreen">
        <h2 class="loading-text">Searching for partner...</h2>
        <div class="loading-animation">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>

      <!-- Chat Screen -->
      <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
          <button class="back-btn" id="backBtn">Back</button>
          <div class="partner-status">Connected</div>
          <button class="next-btn" id="nextBtn">Next</button>
        </div>
        <div class="chat-messages" id="chatMessages">
          <!-- Messages will be added here dynamically -->
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
        <div class="chat-input-area">
          <input
            type="text"
            class="message-input"
            id="messageInput"
            placeholder="Type a message..."
          />
          <button class="send-btn" id="sendBtn">
            <svg class="send-icon" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Connected Notification -->
      <div class="connected-notification" id="connectedNotification">
        Connected!
      </div>
    </div>

    <script>
      // DOM Elements
      const homeScreen = document.getElementById("homeScreen");
      const loadingScreen = document.getElementById("loadingScreen");
      const chatScreen = document.getElementById("chatScreen");
      const startBtn = document.getElementById("startBtn");
      const backBtn = document.getElementById("backBtn");
      const nextBtn = document.getElementById("nextBtn");
      const sendBtn = document.getElementById("sendBtn");
      const messageInput = document.getElementById("messageInput");
      const chatMessages = document.getElementById("chatMessages");
      const connectedNotification = document.getElementById(
        "connectedNotification",
      );
      const tagInput = document.getElementById("tagInput");
      const tagsContainer = document.getElementById("tagsContainer");
      const typingIndicator = document.getElementById("typingIndicator");

      // Simulated partner names for demo
      const partnerNames = [
        "Alex",
        "Jordan",
        "Taylor",
        "Casey",
        "Morgan",
        "Riley",
        "Jamie",
        "Quinn",
        "Avery",
        "Skyler",
      ];

      let currentPartner = "";
      let tags = [];

      // Event Listeners
      startBtn.addEventListener("click", startChat);
      backBtn.addEventListener("click", goBack);
      nextBtn.addEventListener("click", findNewPartner);
      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      // Tag input event listeners
      tagInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          addTag();
        }
      });

      tagInput.addEventListener("blur", function () {
        addTag();
      });

      // Functions for tag management
      function addTag() {
        const tagText = tagInput.value.trim().replace(/,/g, "");
        if (tagText && !tags.includes(tagText)) {
          tags.push(tagText);
          renderTags();
          tagInput.value = "";
        }
      }

      function removeTag(index) {
        tags.splice(index, 1);
        renderTags();
      }

      function renderTags() {
        tagsContainer.innerHTML = "";
        tags.forEach((tag, index) => {
          const tagElement = document.createElement("div");
          tagElement.classList.add("tag");
          tagElement.innerHTML = `
          ${tag}
          <span class="tag-remove" data-index="${index}">×</span>
        `;
          tagsContainer.appendChild(tagElement);
        });

        // Add event listeners to remove buttons
        document.querySelectorAll(".tag-remove").forEach((button) => {
          button.addEventListener("click", function () {
            const index = parseInt(this.getAttribute("data-index"));
            removeTag(index);
          });
        });
      }

      // Chat Functions
      function startChat() {
        homeScreen.style.display = "none";
        loadingScreen.style.display = "flex";

        // Simulate finding a partner after a random time (1-3 seconds)
        setTimeout(
          () => {
            loadingScreen.style.display = "none";
            chatScreen.style.display = "flex";

            // Show connected notification
            connectedNotification.style.display = "block";
            setTimeout(() => {
              connectedNotification.style.display = "none";
            }, 2000);

            // Set random partner
            currentPartner =
              partnerNames[Math.floor(Math.random() * partnerNames.length)];

            // Add welcome message
            let welcomeMessage = `Hi there! I'm ${currentPartner}. How are you doing today?`;

            // If tags were added, mention them
            if (tags.length > 0) {
              welcomeMessage = `Hi there! I'm ${currentPartner}. I see you're interested in ${tags.join(", ")}. That's cool!`;
            }

            // Show typing indicator before sending welcome message
            showTypingIndicator();

            setTimeout(() => {
              hideTypingIndicator();
              addMessage(welcomeMessage, "partner");
            }, 1500);
          },
          Math.random() * 2000 + 1000,
        );
      }

      function goBack() {
        chatScreen.style.display = "none";
        homeScreen.style.display = "flex";
        chatMessages.innerHTML = ""; // Clear chat history

        // Re-add the typing indicator to the chat messages
        chatMessages.appendChild(typingIndicator);
      }

      function findNewPartner() {
        chatScreen.style.display = "none";
        loadingScreen.style.display = "flex";
        chatMessages.innerHTML = ""; // Clear chat history

        // Re-add the typing indicator to the chat messages
        chatMessages.appendChild(typingIndicator);

        // Simulate finding a new partner after a random time (1-3 seconds)
        setTimeout(
          () => {
            loadingScreen.style.display = "none";
            chatScreen.style.display = "flex";

            // Show connected notification
            connectedNotification.style.display = "block";
            setTimeout(() => {
              connectedNotification.style.display = "none";
            }, 2000);

            // Set new random partner (different from current)
            let newPartner;
            do {
              newPartner =
                partnerNames[Math.floor(Math.random() * partnerNames.length)];
            } while (newPartner === currentPartner);

            currentPartner = newPartner;

            // Add welcome message from new partner
            let welcomeMessages = [
              `Hey! I'm ${currentPartner}. What's up?`,
              `Hi there! I'm ${currentPartner}. How's your day going?`,
              `Hello! I'm ${currentPartner} here. Nice to meet you!`,
              `Hey! ${currentPartner} at your service. What would you like to chat about?`,
            ];

            // If tags were added, sometimes mention them
            if (tags.length > 0 && Math.random() > 0.5) {
              welcomeMessages = [
                `Hey! I'm ${currentPartner}. I noticed you're into ${tags.join(", ")}. I love that stuff too!`,
                `Hi there! ${currentPartner} here. So you're interested in ${tags.join(", ")}? Let's talk about it!`,
                `Hello! I'm ${currentPartner}. ${tags.join(", ")} caught my attention. What aspects are you into?`,
              ];
            }

            const randomMessage =
              welcomeMessages[
                Math.floor(Math.random() * welcomeMessages.length)
              ];

            // Show typing indicator before sending welcome message
            showTypingIndicator();

            setTimeout(() => {
              hideTypingIndicator();
              addMessage(randomMessage, "partner");
            }, 1500);
          },
          Math.random() * 2000 + 1000,
        );
      }

      function sendMessage() {
        const message = messageInput.value.trim();
        if (message) {
          addMessage(message, "me");
          messageInput.value = "";

          // Show typing indicator
          showTypingIndicator();

          // Simulate partner typing and responding after a delay
          setTimeout(
            () => {
              // Generate a random response
              const responses = [
                "That's interesting! Tell me more.",
                "I see what you mean.",
                "I've been thinking about that too!",
                "Hmm, I never thought about it that way.",
                "That's cool! What else is on your mind?",
                "I totally agree with you.",
                "Really? That's fascinating!",
                "I had a similar experience once.",
                "That's a great point!",
                "I'm not sure I understand. Could you explain?",
              ];

              const randomResponse =
                responses[Math.floor(Math.random() * responses.length)];

              // Hide typing indicator and send message
              hideTypingIndicator();
              addMessage(randomResponse, "partner");
            },
            Math.random() * 2000 + 1000,
          );
        }
      }

      function addMessage(text, sender) {
        const messageElement = document.createElement("div");
        messageElement.classList.add("message");

        if (sender === "partner") {
          messageElement.classList.add("partner-message");
          messageElement.innerHTML = `<div class="message-label">Partner:</div>${text}`;
        } else {
          messageElement.classList.add("my-message");
          messageElement.innerHTML = `<div class="message-label">Me:</div>${text}`;
        }

        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to bottom
      }

      // Typing indicator functions
      function showTypingIndicator() {
        typingIndicator.style.display = "block";
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function hideTypingIndicator() {
        typingIndicator.style.display = "none";
      }
    </script>
  </body>
</html>
