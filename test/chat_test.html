<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LetsGo</title>
<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #e0e7ff;
  --secondary: #10b981;
  --background: #f8fafc;
  --surface: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius: 12px;
  --radius-full: 9999px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--background);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.container {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  height: 100vh;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}

.header {
  padding: 1rem;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  text-align: center;
  position: relative;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.025em;
}

.status {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--secondary);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.status.connected {
  opacity: 1;
}

.tags-section {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
}

.tags-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  min-height: 32px;
}

.tag {
  display: inline-flex;
  align-items: center;
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 0.25rem 0.75rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 500;
  gap: 0.25rem;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.tag-remove {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-full);
  background: var(--primary-dark);
  color: white;
  font-size: 0.75rem;
  margin-left: 0.25rem;
  transition: background-color 0.2s;
}

.tag-remove:hover {
  background: #4338ca;
}

.tags-input-container {
  position: relative;
  display: flex;
}

.tags-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.875rem;
  background: var(--surface);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.tags-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
}

.tags-input::placeholder {
  color: var(--text-muted);
}

.add-tag-btn {
  position: absolute;
  right: 0.5rem;
  top: 50%;
  transform: translateY(-50%);
  background: var(--primary);
  color: white;
  border: none;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-full);
  font-size: 1rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.2s;
}

.add-tag-btn:hover {
  background: var(--primary-dark);
}

.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  scroll-behavior: smooth;
}

.chat-box::-webkit-scrollbar {
  width: 4px;
}

.chat-box::-webkit-scrollbar-track {
  background: transparent;
}

.chat-box::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--radius-full);
}

.message {
  max-width: 80%;
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-size: 0.875rem;
  line-height: 1.4;
  word-wrap: break-word;
  animation: slideIn 0.2s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.partner {
  align-self: flex-start;
  background: var(--border);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
}

.message.self {
  align-self: flex-end;
  background: var(--primary);
  color: white;
  border-bottom-right-radius: 4px;
}

.message.system {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.75rem;
  padding: 0.5rem;
  text-align: center;
  max-width: 100%;
}

.loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  color: var(--text-muted);
  font-size: 0.875rem;
  background: rgba(255, 255, 255, 0.8);
  border-radius: var(--radius);
  backdrop-filter: blur(4px);
  z-index: 10;
}

.loader.show {
  display: flex;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-top: 2px solid var(--primary);
  border-radius: var(--radius-full);
  animation: spin 1s linear infinite;
  margin-bottom: 0.5rem;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.controls {
  padding: 1rem;
  display: flex;
  gap: 0.75rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.btn {
  flex: 1;
  padding: 0.75rem 1rem;
  border: none;
  border-radius: var(--radius);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--border);
  color: var(--text-primary);
}

.btn-secondary:hover:not(:disabled) {
  background: #cbd5e1;
  transform: translateY(-1px);
}

.message-input-container {
  padding: 1rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.message-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  font-size: 0.875rem;
  background: var(--surface);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  resize: none;
  min-height: 44px;
  max-height: 120px;
}

.message-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
}

.message-input::placeholder {
  color: var(--text-muted);
}

.message-input:disabled {
  background: #f1f5f9;
  color: var(--text-muted);
  cursor: not-allowed;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  text-align: center;
  padding: 1rem;
}

.empty-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

@media (max-width: 480px) {
  .container {
    max-width: 100%;
    border-radius: 0;
    box-shadow: none;
  }
  
  .message {
    max-width: 85%;
  }
  
  .controls {
    padding: 0.75rem;
  }
  
  .message-input-container {
    padding: 0.75rem;
  }
  
  .tags-section {
    padding: 0.75rem;
  }
}

@media (max-height: 600px) {
  .header {
    padding: 0.75rem;
  }
  
  .header h1 {
    font-size: 1.25rem;
  }
  
  .tags-section {
    padding: 0.5rem 0.75rem;
  }
  
  .controls {
    padding: 0.5rem 0.75rem;
  }
  
  .message-input-container {
    padding: 0.5rem 0.75rem;
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  .container {
    flex-direction: row;
    height: 100vh;
  }
  
  .sidebar {
    width: 30%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  
  .main-content {
    width: 70%;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  .header {
    padding: 0.5rem;
  }
  
  .header h1 {
    font-size: 1rem;
  }
  
  .tags-section {
    padding: 0.5rem;
  }
  
  .chat-box {
    padding: 0.5rem;
  }
  
  .message {
    padding: 0.5rem 0.75rem;
    font-size: 0.8125rem;
  }
}

@media (prefers-reduced-motion) {
  .message, .tag {
    animation: none;
  }
  
  .chat-box {
    scroll-behavior: auto;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>LetsGo</h1>
    <div class="status" id="status"></div>
  </div>

  <div class="tags-section">
    <div class="tags-container" id="tagsContainer"></div>
    <div class="tags-input-container">
      <input 
        id="tagInput" 
        class="tags-input" 
        placeholder="Add interests (press Enter)" 
        autocomplete="off" 
      />
      <button id="addTagBtn" class="add-tag-btn" aria-label="Add tag">+</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Connecting...</span>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <p>Start a conversation by clicking the Start Chat button</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="matchBtn" class="btn btn-primary">
      <span>Start Chat</span>
    </button>
    <button id="nextBtn" class="btn btn-secondary" disabled>
      <span>Next</span>
    </button>
  </div>

  <div class="message-input-container">
    <textarea 
      id="messageInput" 
      class="message-input" 
      placeholder="Type a message..." 
      disabled 
      autocomplete="off"
      rows="1"
    ></textarea>
  </div>
</div>

<script>
  const socketUrl = "ws://localhost:8080/ws/chat";
  let socket;
  let tagsList = [];
  
  const elements = {
    chatBox: document.getElementById("chatBox"),
    loader: document.getElementById("loader"),
    status: document.getElementById("status"),
    tagInput: document.getElementById("tagInput"),
    tagsContainer: document.getElementById("tagsContainer"),
    addTagBtn: document.getElementById("addTagBtn"),
    messageInput: document.getElementById("messageInput"),
    matchBtn: document.getElementById("matchBtn"),
    nextBtn: document.getElementById("nextBtn")
  };

  // Auto-resize textarea
  elements.messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  function appendMessage(text, type = 'system') {
    // Clear empty state if it exists
    const emptyState = elements.chatBox.querySelector('.empty-state');
    if (emptyState) {
      elements.chatBox.removeChild(emptyState);
    }
    
    const div = document.createElement("div");
    div.textContent = text;
    div.className = `message ${type}`;
    elements.chatBox.appendChild(div);
    elements.chatBox.scrollTop = elements.chatBox.scrollHeight;
  }

  function showLoader(show, text = "Connecting...") {
    if (show) {
      elements.loader.classList.add('show');
      elements.loader.querySelector('span').textContent = text;
    } else {
      elements.loader.classList.remove('show');
    }
  }

  function updateStatus(connected) {
    if (connected) {
      elements.status.classList.add('connected');
    } else {
      elements.status.classList.remove('connected');
    }
  }

  function setUIState(state) {
    const states = {
      disconnected: {
        matchBtn: { disabled: false, text: "Start Chat" },
        nextBtn: { disabled: true },
        messageInput: { disabled: true },
        tagInput: { disabled: false },
        addTagBtn: { disabled: false }
      },
      connecting: {
        matchBtn: { disabled: true, text: "Connecting..." },
        nextBtn: { disabled: true },
        messageInput: { disabled: true },
        tagInput: { disabled: true },
        addTagBtn: { disabled: true }
      },
      connected: {
        matchBtn: { disabled: true, text: "Connected" },
        nextBtn: { disabled: false },
        messageInput: { disabled: false },
        tagInput: { disabled: true },
        addTagBtn: { disabled: true }
      },
      searching: {
        matchBtn: { disabled: true, text: "Searching..." },
        nextBtn: { disabled: true },
        messageInput: { disabled: true },
        tagInput: { disabled: true },
        addTagBtn: { disabled: true }
      }
    };

    const config = states[state];
    if (!config) return;

    elements.matchBtn.disabled = config.matchBtn.disabled;
    elements.matchBtn.querySelector('span').textContent = config.matchBtn.text;
    elements.nextBtn.disabled = config.nextBtn.disabled;
    elements.messageInput.disabled = config.messageInput.disabled;
    elements.tagInput.disabled = config.tagInput.disabled;
    elements.addTagBtn.disabled = config.addTagBtn.disabled;

    if (config.messageInput.disabled === false) {
      elements.messageInput.focus();
    }
  }

  function addTag(tagText) {
    if (!tagText || tagsList.includes(tagText)) return;
    
    tagsList.push(tagText);
    
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = `
      ${tagText}
      <span class="tag-remove" data-tag="${tagText}">×</span>
    `;
    elements.tagsContainer.appendChild(tag);
    
    elements.tagInput.value = '';
  }

  function removeTag(tagText) {
    tagsList = tagsList.filter(tag => tag !== tagText);
    
    const tags = elements.tagsContainer.querySelectorAll('.tag');
    tags.forEach(tag => {
      const removeBtn = tag.querySelector('.tag-remove');
      if (removeBtn && removeBtn.getAttribute('data-tag') === tagText) {
        tag.remove();
      }
    });
  }

  function connect() {
    socket = new WebSocket(socketUrl);
    setUIState('connecting');
    showLoader(true);
    elements.chatBox.innerHTML = "";
    updateStatus(false);

    socket.onopen = () => {
      console.log("WebSocket connection opened");
      appendMessage("🔄 Finding someone to chat with...", 'system');
    };

    socket.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        console.log("Received:", data);

        switch(data.status) {
          case "902":
            socket.send(JSON.stringify({ tags: tagsList }));
            showLoader(true, "Matching...");
            break;

          case "913":
            showLoader(false);
            updateStatus(true);
            setUIState('connected');
            appendMessage("✨ Connected! Say hello", 'system');
            break;

          case "904":
            appendMessage(data.content, 'partner');
            break;

          case "905":
            if (data.content.toLowerCase().includes('error')) {
              console.error("Server error:", data.content);
              showLoader(false);
              updateStatus(false);
              setUIState('disconnected');
              appendMessage("❌ Connection error. Try again.", 'system');
            }
            break;
        }
      } catch (err) {
        console.error("Parse error:", err);
      }
    };

    socket.onerror = (err) => {
      console.error("WebSocket error:", err);
      showLoader(false);
      updateStatus(false);
      setUIState('disconnected');
    };

    socket.onclose = () => {
      console.log("Connection closed");
      showLoader(false);
      updateStatus(false);
      setUIState('disconnected');
      appendMessage("👋 Chat ended", 'system');
    };
  }

  function sendMessage() {
    const msg = elements.messageInput.value.trim();
    if (!msg || !socket || socket.readyState !== WebSocket.OPEN) return;
    
    socket.send(JSON.stringify({ content: msg }));
    appendMessage(msg, 'self');
    elements.messageInput.value = "";
    elements.messageInput.style.height = 'auto';
  }

  // Handle tag input
  function handleAddTag() {
    const tagText = elements.tagInput.value.trim();
    if (tagText) {
      addTag(tagText);
    }
  }

  // Event listeners
  elements.matchBtn.addEventListener("click", connect);

  elements.nextBtn.addEventListener("click", () => {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ content: "/next" }));
      setUIState('searching');
      showLoader(true, "Finding next person...");
      appendMessage("🔄 Looking for someone new...", 'system');
    }
  });

  elements.messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  elements.tagInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      handleAddTag();
    }
  });

  elements.addTagBtn.addEventListener("click", handleAddTag);

  // Event delegation for tag removal
  elements.tagsContainer.addEventListener("click", (e) => {
    if (e.target.classList.contains('tag-remove')) {
      const tagText = e.target.getAttribute('data-tag');
      removeTag(tagText);
    }
  });

  // Check for landscape mode on mobile
  function checkOrientation() {
    const container = document.querySelector('.container');
    
    if (window.innerHeight < 500 && window.innerWidth > window.innerHeight) {
      // Landscape mode on small screen
      if (!container.querySelector('.sidebar')) {
        // Restructure for landscape
        const sidebar = document.createElement('div');
        sidebar.className = 'sidebar';
        
        const mainContent = document.createElement('div');
        mainContent.className = 'main-content';
        
        // Move elements to sidebar
        sidebar.appendChild(document.querySelector('.header'));
        sidebar.appendChild(document.querySelector('.tags-section'));
        sidebar.appendChild(document.querySelector('.controls'));
        
        // Move elements to main content
        mainContent.appendChild(document.querySelector('.chat-container'));
        mainContent.appendChild(document.querySelector('.message-input-container'));
        
        // Clear container and add new structure
        container.innerHTML = '';
        container.appendChild(sidebar);
        container.appendChild(mainContent);
      }
    } else {
      // Portrait mode or large screen
      if (container.querySelector('.sidebar')) {
        // Restore original structure
        const originalOrder = [
          '.header',
          '.tags-section',
          '.chat-container',
          '.controls',
          '.message-input-container'
        ];
        
        const sidebar = container.querySelector('.sidebar');
        const mainContent = container.querySelector('.main-content');
        
        container.innerHTML = '';
        
        originalOrder.forEach(selector => {
          const element = sidebar.querySelector(selector) || mainContent.querySelector(selector);
          if (element) {
            container.appendChild(element);
          }
        });
      }
    }
  }

  // Listen for orientation changes
  window.addEventListener('resize', checkOrientation);
  
  // Initial check
  checkOrientation();

  // Initialize
  setUIState('disconnected');
</script>

</body>
</html>
