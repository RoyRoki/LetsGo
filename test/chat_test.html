<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Chatting Service WebSocket Test</title>
</head>

<body>
    <h2>Chat Matching WebSocket Test</h2>

    <label for="tags">Enter tags (comma-separated):</label>
    <input type="text" id="tags" placeholder="e.g. gaming,music" />
    <button onclick="setTags()">Set Tags & Match</button>

    <div style="margin-top: 20px;">
        <div id="chatBox"
            style="background: #f9f9f9; padding: 1rem; height: 200px; overflow-y: auto; border: 1px solid #ccc;"></div>
        <input type="text" id="messageInput" placeholder="Type a message..."
            onkeydown="if(event.key === 'Enter') sendMessage()" />
        <button onclick="sendMessage()">Send</button>
    </div>

    <pre id="log" style="margin-top: 20px; background: #f0f0f0; padding: 1rem"></pre>

    <script>
        let socket;
        let tagPayload = null;
        let readyToSendTags = false;

        // Connect to server immediately on page load
        window.onload = () => {
            socket = new WebSocket("ws://localhost:8080/ws/chat");

            socket.onopen = () => {
                log("✅ Connected to WebSocket. Waiting for server readiness...");
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(JSON.stringify(data));

                    switch (data.status) {
                        case "902":
                            log("✅ Server is ready for tags.");
                            if (tagPayload) {
                                socket.send(JSON.stringify(tagPayload));
                                log("📤 Tags sent: " + JSON.stringify(tagPayload));
                            } else {
                                readyToSendTags = true;
                                log("⚠️ Tags not set yet. Waiting for user input...");
                            }
                            break;
                        case "904":
                            displayMessage("🗨️ Partner: " + data.content);
                            break;
                        case "905":
                            displayMessage("⚙️ System: " + data.content);
                            break;
                        default:
                            log("ℹ️ [" + (data.status || "") + "] " + data.content);
                            break;
                    }

                } catch (err) {
                    log("❌ Failed to parse message: " + err.message);
                }
            };

            socket.onerror = (err) => {
                log("❌ WebSocket error: " + err.message);
            };

            socket.onclose = () => {
                log("🔌 Connection closed.");
            };
        };

        function setTags() {
            const tagsInput = document.getElementById("tags").value;
            const tags = tagsInput
                .split(",")
                .map(tag => tag.trim())
                .filter(tag => tag.length > 0);

            tagPayload = { tags };

            if (socket && socket.readyState === WebSocket.OPEN && readyToSendTags) {
                socket.send(JSON.stringify(tagPayload));
                log("📤 Tags sent: " + JSON.stringify(tagPayload));
            } else {
                log("⏳ Tags saved. Will send once server is ready...");
            }
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const msg = input.value.trim();
            if (msg && socket && socket.readyState === WebSocket.OPEN) {
                const messagePayload = { content: msg };
                socket.send(JSON.stringify(messagePayload));
                displayMessage("🧑 You: " + msg);
                input.value = "";
            }
        }

        function displayMessage(message) {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML += `<div>${message}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function log(message) {
            const logEl = document.getElementById("log");
            logEl.textContent += message + "\n";
        }
    </script>
</body>

</html>
